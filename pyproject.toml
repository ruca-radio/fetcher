[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "fetcher-v1"
version = "1.0.0"
description = "Terminal UI and CLI for multi-site video search, preview, and download workflows."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Patrick DeLuca" }
]
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "Pillow",
  "rich",
  "selenium",
  "textual",
]
keywords = ["cli", "downloader", "terminal", "textual", "yt-dlp"]

[project.urls]
Homepage = "https://github.com/ruca-radio/fetcher"
Repository = "https://github.com/ruca-radio/fetcher"

[project.scripts]
fetcher = "fetchtui:main"

[tool.hatch.build.targets.wheel]
include = [
  "/fetchtui.py",
  "/extract_twitter_cookies.py",
  "/capture_twitter_api.js",
  "/README.md",
  "/LICENSE",
]
